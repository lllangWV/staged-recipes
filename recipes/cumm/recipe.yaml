context:
  version: "0.8.2"

package:
  name: cumm
  version: ${{ version }}

source:
  url: https://github.com/FindDefinition/cumm/archive/refs/tags/v${{ version }}.tar.gz
  sha256: d92914ecca500f85d7dc156b648fa5d8ccb33834da377be4e30d5e3236f6a945

build:
  number: 0
  skip:
    - cuda_compiler_version == "None"
  script:
    - if: unix
      then: bash build.sh
    - if: win
      then: cmd /c bld.bat
  missing_dso_whitelist:
    - if: win
      then:
        - "*/nvcuda.dll"

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('cuda') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools
    - wheel
    - pccm >=0.4.15
    - ccimport >=0.4.4
    - pybind11 >=2.6.0
    - cuda-version ${{ cuda_compiler_version }}
    # CUDA 12+ modular SDK packages (required for all builds since CUDA 11.8 was dropped)
    - cuda-cudart-dev
    - libcublas-dev
    - libcusparse-dev
  run:
    - python
    - pccm >=0.4.15
    - ccimport
    - pybind11 >=2.6.0
    - fire
    - numpy
    - sympy
    - ${{ pin_compatible('cuda-version', max_pin='x', min_pin='x') }}
    # Runtime CUDA libraries
    - cuda-cudart
    - libcublas
    - libcusparse

tests:
  - python:
      imports:
        - cumm
      pip_check: true

about:
  homepage: https://github.com/FindDefinition/cumm
  license: MIT
  license_family: MIT
  license_file: LICENSE
  repository: https://github.com/FindDefinition/cumm
  summary: CUda Matrix Multiply library - a high-performance CUDA GEMM library using Python metaprogramming

extra:
  recipe-maintainers:
    - lllangWV
